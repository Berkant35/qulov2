name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          cache: true

      - name: Install
        run: flutter pub get

      # NOT: --no-fatal-warnings geçici. Tek kalan uyarı app_review_manager.dart'taki
      # kullanılmayan _openStoreUrl; o temizlenince bu bayrak kaldırılmalı.
      - name: Analyze
        run: dart analyze --no-fatal-warnings

      - name: Test
        run: flutter test
